services:
  postgres:
    image: postgres:16-alpine
    container_name: perch-demo-postgres
    ports:
      - "54329:5432"
    environment:
      POSTGRES_DB: perch_demo
      POSTGRES_USER: perch_demo
      POSTGRES_PASSWORD: perch_demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perch_demo -d perch_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - perch-demo-postgres:/var/lib/postgresql/data

volumes:
  perch-demo-postgres:
