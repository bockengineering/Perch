name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://perch:perch@localhost:5432/perch?schema=public
      APP_MAC_PEPPER: ci-mac-pepper
      FIELD_ENCRYPTION_KEY: 1111111111111111111111111111111111111111111111111111111111111111
      VOUCHER_CODE_SECRET: ci-voucher-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
